services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-pockets-web}
    env_file:
      - .env
    networks:
      - default
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-pockets-backend}
    env_file:
      - .env
    networks:
      - default
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      # Persist database and uploads
      - ./server/data:/usr/src/app/data
      - ./server/uploads:/usr/src/app/uploads
    environment:
      - PORT=3001
      - DATABASE_PATH=/usr/src/app/data/pockets.db

networks:
  default:
    driver: bridge